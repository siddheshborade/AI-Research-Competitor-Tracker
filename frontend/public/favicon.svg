<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#07080D"/>
  <rect width="64" height="64" rx="16" stroke="#1A1F2C" stroke-width="2"/>
  <g transform="translate(32, 32)">
    <!-- Cyan horizontal eye ellipse -->
    <ellipse cx="0" cy="0" rx="20" ry="10" stroke="#00D9FF" stroke-width="2.5" fill="none"/>
    <!-- Amber vertical/diagonal ellipse -->
    <ellipse cx="0" cy="0" rx="10" ry="20" stroke="#F59E0B" stroke-width="2.5" fill="none" transform="rotate(30)"/>
    <!-- Deep purple/indigo circle/ellipse -->
    <ellipse cx="0" cy="0" rx="16" ry="16" stroke="#7C2CFF" stroke-width="2" stroke-dasharray="4 2" fill="none"/>
    
    <!-- Nodes -->
    <circle cx="-20" cy="0" r="3" fill="#00D9FF"/>
    <circle cx="20" cy="0" r="3" fill="#00D9FF"/>
    <circle cx="-5" cy="-17" r="3" fill="#F59E0B"/>
    <circle cx="5" cy="17" r="3" fill="#F59E0B"/>
    <circle cx="-13" cy="10" r="2.5" fill="#7C2CFF"/>
    <circle cx="13" cy="-10" r="2.5" fill="#7C2CFF"/>
    
    <!-- Center Core -->
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>