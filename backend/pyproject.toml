[project]
name = "backend"
version = "1.0.0"
description = "FastAPI Intelligence Agent Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "sqlalchemy>=2.0.32,<3.0.0",
    "psycopg2-binary>=2.9.9; sys_platform != 'win32' or python_version < '3.14'",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.2.0",
]

[tool.vercel]
entrypoint = "main:app"
